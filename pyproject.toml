[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scraping-ai-agent"
version = "0.1.0"
description = "Describe what you want from a web page in plain language; the agent extracts it as structured data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "muhammad-sheri" }]
keywords = ["web-scraping", "llm", "agent", "openai", "ollama", "structured-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
ui = ["streamlit>=1.61", "pandas>=2.0"]  # 1.61: segmented_control, pills, theme tokens
browser = ["playwright>=1.44"]
bot = ["curl_cffi>=0.7"]
mcp = ["fastmcp>=3.0"]
dev = ["pytest>=8.0", "fastmcp>=3.0"]

[project.scripts]
scrape-agent = "scraper_agent.cli:main"
scrape-agent-eval = "scraper_agent.evals.cli:main"
scrape-agent-mcp = "scraper_agent.mcp_server:main"
scrape-agent-monitor = "scraper_agent.monitor.cli:main"

[project.urls]
Homepage = "https://github.com/muhammad-sheri/web-scraping-ai-agent"
Issues = "https://github.com/muhammad-sheri/web-scraping-ai-agent/issues"

[tool.setuptools]
packages = ["scraper_agent", "scraper_agent.providers", "scraper_agent.evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
