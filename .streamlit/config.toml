# Design tokens for the Streamlit UI.
#
# Everything here is theme *configuration* rather than CSS, which matters:
# Streamlit applies these to its own components (widgets, dataframes, badges,
# alerts), so the app looks designed instead of looking like default Streamlit
# with a stylesheet fighting it. ui.py adds only the layer this cannot express
# — the hero, the stat tiles and the filter panel.
#
# Light and dark are both fully specified, so the theme toggle in the app menu
# produces two finished looks rather than one good one and one accident.

[browser]
gatherUsageStats = false

[theme]
base = "light"

font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
headingFont = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
codeFont = "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
baseFontSize = 15
headingFontWeights = [700, 700, 650, 600, 600, 600]

baseRadius = "0.7rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false

metricValueFontSize = "2rem"
metricValueFontWeight = 700

# Indigo primary: distinct from Streamlit's default red, and it reads as a
# tool rather than an alert.
primaryColor = "#5B5BD6"
backgroundColor = "#F7F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16181F"
linkColor = "#4F46E5"
borderColor = "#E4E5EE"
dataframeBorderColor = "#E4E5EE"
dataframeHeaderBackgroundColor = "#F3F3F8"
codeBackgroundColor = "#F3F3F8"
codeTextColor = "#4338CA"

# Semantic colours, used by st.badge and the alert boxes. Green means in
# stock, red means out of stock, orange means discounted — the same meanings
# the table columns carry.
greenColor = "#0E9F6E"
greenTextColor = "#05603A"
greenBackgroundColor = "#E6F6EF"
redColor = "#DC2626"
redTextColor = "#991B1B"
redBackgroundColor = "#FDECEC"
orangeColor = "#D97706"
orangeTextColor = "#92400E"
orangeBackgroundColor = "#FEF3C7"
violetColor = "#7C3AED"
violetTextColor = "#5B21B6"
violetBackgroundColor = "#F1EBFE"
blueColor = "#2563EB"
blueTextColor = "#1E40AF"
blueBackgroundColor = "#E8EFFD"
grayColor = "#6B7280"
grayTextColor = "#4B5563"
grayBackgroundColor = "#F1F1F5"

chartCategoricalColors = ["#5B5BD6", "#0E9F6E", "#D97706", "#7C3AED", "#2563EB", "#DC2626"]

[theme.dark]
primaryColor = "#8B8BF5"
backgroundColor = "#0B0C12"
secondaryBackgroundColor = "#14161F"
textColor = "#E6E8F0"
linkColor = "#A5B4FC"
borderColor = "#242736"
dataframeBorderColor = "#242736"
dataframeHeaderBackgroundColor = "#1A1D28"
codeBackgroundColor = "#1A1D28"
codeTextColor = "#C7D2FE"

greenColor = "#34D399"
greenTextColor = "#6EE7B7"
greenBackgroundColor = "#0C2B22"
redColor = "#F87171"
redTextColor = "#FCA5A5"
redBackgroundColor = "#341418"
orangeColor = "#FBBF24"
orangeTextColor = "#FCD34D"
orangeBackgroundColor = "#2E2110"
violetColor = "#A78BFA"
violetTextColor = "#C4B5FD"
violetBackgroundColor = "#221B3A"
blueColor = "#60A5FA"
blueTextColor = "#93C5FD"
blueBackgroundColor = "#12203A"
grayColor = "#9CA3AF"
grayTextColor = "#D1D5DB"
grayBackgroundColor = "#1A1D28"
